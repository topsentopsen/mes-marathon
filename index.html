<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MES-Marathon · Christian, Sandra und das ewige MES</title>
<meta name="description" content="Retro-Fabrikspiel im Stil von Mad TV: Christian oder Sandra führen seit Jahren ein MES ein. Stationen, Verpackungsautomat, IT-Chefin mit Automatisierungspyramide, SAP-Migration, Firmenübernahme, KPIs und Budget. Läuft im Browser.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="img/portrait-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-item" id="hud-day">Tag 1</div>
    <div class="hud-item" id="hud-clock">07:30</div>
    <div class="hud-item" id="hud-energy"></div>
    <div class="hud-item" id="hud-chef"></div>
    <div class="hud-item" id="hud-family"></div>
    <div class="hud-item" id="hud-schicht"></div>
    <div class="hud-item" id="hud-budget"></div>
    <div class="hud-item" id="hud-kpi"></div>
    <div class="hud-item" id="hud-prog"></div>
    <div class="hud-btns">
      <button id="btn-pause" title="Pause (Leertaste)">Pause</button>
      <button id="btn-speed" title="Tempo: Langsam, Normal, Schnell (Tasten + und −)">Tempo: Langsam</button>
      <button id="btn-kopf" title="Kopfhörer auf: bis Feierabend halten sich manche Besucher kurz (Schichtleiter −1, Taste K)">🎧 Kopfhörer</button>
      <button id="btn-sound" title="Ton an oder aus (Taste M)">Ton an</button>
      <input type="range" id="vol" min="0" max="100" value="50" title="Lautstärke" aria-label="Lautstärke">
      <button id="btn-figur" title="Deine Figur: Stärken und Schwächen">👤</button>
      <button id="btn-menu">Menü</button>
    </div>
  </header>
  <div id="calendar"></div>
  <main id="stage">
    <canvas id="cv" width="480" height="300"></canvas>
    <section id="room" class="hidden"></section>
  </main>
  <nav id="rooms"></nav>
  <footer id="ticker" title="Tippen: Tagesprotokoll" tabindex="0" role="status"></footer>
  <p class="foot">MES-Marathon <span id="foot-v">v0.12</span> · inspiriert von Mad TV (1991) · eigenes Fanprojekt ohne Original-Inhalte · alle Figuren frei erfunden, nur Christian und Sandra haben Namen · Musik und Fabriklärm selbst erzeugt</p>
</div>
<div id="overlay" class="hidden"></div>
<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/building.js"></script>
<script src="js/ui.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
<!-- GoatCounter (nur Seitenaufrufe, nur der Pfad): SEITENNAME ist ein Platzhalter, vor dem Veröffentlichen durch den eigenen GoatCounter-Namen ersetzen, siehe docs/GOATCOUNTER.md -->
<script async src="vendor/goatcounter-count.js" data-goatcounter="https://SEITENNAME.goatcounter.com/count" data-goatcounter-settings='{"allow_local": false, "allow_frame": false, "no_events": true}'></script>
</body>
</html>
